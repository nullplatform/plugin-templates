version: 1

categories:
  - type: scope
    name: Deployment target
    description: Let the platform deploy apps to a new kind of infrastructure (Kubernetes, Lambda, ECS, bare metal, on-prem VMs…).
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'Kubernetes K3D', 'AWS Lambda', 'ECS Fargate' (slug is auto-derived)"

  - type: simple
    name: Custom command handler
    description: Run code when the platform dispatches a command — health checks, migrations, notifications, data sync, anything the agent should execute on your behalf.
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'DB Migrator', 'Slack Notifier', 'Secret Rotator' (slug is auto-derived)"

  - type: service
    name: Application dependency
    description: Wire up anything an application needs to run or operate — databases, caches, queues, load balancers, API gateways, observability (Datadog, Grafana, …), CDNs.
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'Postgres', 'Redis', 'Datadog', 'CloudFront CDN' (slug is auto-derived)"

sdks:
  - id: bun
    name: Bun
    description: TypeScript with zero-config and first-class bundling. Fast dev iteration, single-file compiled binary via `bun build --compile` for production.

templates:
  - id: scope-bun
    name: Scope (TypeScript/Bun)
    description: A deployment target on the SDK's package layer — the scope, its scope type and each lifecycle action (create, deploy, switch traffic, roll back, logs) as a typed handler; tests are one pkg.run() call.
    path: bun/scope
    type: scope
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every action in-process, no platform"
      - "np package dev             # browser dev UI against a mock platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"

  - id: simple-bun
    name: Command handler (TypeScript/Bun)
    description: One execute() component on the SDK's package layer — answer any command the agent hands over (health checks, migrations, live reads), the answer in the same response; tests are one pkg.execute() call.
    path: bun/simple
    type: simple
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every command in-process, no platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"

  - id: service-bun
    name: Service / dependency (TypeScript/Bun)
    description: An application dependency on the SDK's package layer — the service and its connect link declared as values, create/update/delete as typed handlers; tests are one pkg.run() call.
    path: bun/service
    type: service
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every action in-process, no platform"
      - "np package dev             # browser dev UI against a mock platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"
