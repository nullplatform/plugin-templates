version: 1

# Templates registry for `np package init`.
#
# Two orthogonal dimensions:
#   1. CATEGORY — what the plugin is (the problem it solves). First picker step.
#   2. SDK      — how it's implemented (runtime/language). Second picker step.
#
# `templates` is the sparse (category, sdk) matrix pointing at templates/<path>.
#
# Prompts (category `variables`) ask ONLY for what the scaffold can't derive:
# the human name (the slug is auto-derived from it). Everything else — scope
# category/provider, agent routing, a collector's source — is declared in code
# via the SDK (defineScope/defineService/definePlugin/defineCollector in the
# template's definition file), the single source of truth, and changed there.

categories:
  - type: scope
    name: Deployment target
    description: Let the platform deploy apps to a new kind of infrastructure (Kubernetes, Lambda, ECS, bare metal, on-prem VMs…).
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'Kubernetes K3D', 'AWS Lambda', 'ECS Fargate' (slug is auto-derived)"

  - type: simple
    name: Custom command handler
    description: Run code when the platform dispatches a command — health checks, migrations, notifications, data sync, anything the agent should execute on your behalf.
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'DB Migrator', 'Slack Notifier', 'Secret Rotator' (slug is auto-derived)"

  - type: service
    name: Application dependency
    description: Wire up anything an application needs to run or operate — databases, caches, queues, load balancers, API gateways, observability (Datadog, Grafana, …), CDNs.
    variables:
      - name: Name
        prompt: Plugin name
        hint: "human-readable — e.g. 'Postgres', 'Redis', 'Datadog', 'CloudFront CDN' (slug is auto-derived)"

  - type: collector
    name: Catalog collector
    description: Keep the catalog in sync with a system of record — Kubernetes clusters, GitHub orgs, cloud accounts, CMDB exports — through catalog-ingest-api.
    variables:
      - name: Name
        prompt: Collector name
        hint: "human-readable — e.g. 'Kubernetes Collector', 'GitHub Org Collector', 'CMDB Sync' (slug is auto-derived)"

sdks:
  - id: bun
    name: Bun
    description: TypeScript with zero-config and first-class bundling. Fast dev iteration, single-file compiled binary via `bun build --compile` for production.

templates:
  - id: scope-bun
    name: Scope (TypeScript/Bun)
    description: A deployment target on defineScope — the scope, its scope type and each lifecycle action (create, deploy, switch traffic, roll back, logs) as a handler typed from its schema; tests are one run() call per action.
    path: bun/scope
    type: scope
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every action in-process, no platform"
      - "mise run local             # one action through src/local.ts, no platform"
      - "np package dev             # browser dev UI against a mock platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"

  - id: simple-bun
    name: Command handler (TypeScript/Bun)
    description: One execute() route on definePlugin — answer any command the agent hands over (health checks, migrations, live reads), the answer in the same response; tests are one run() call per command.
    path: bun/simple
    type: simple
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every command in-process, no platform"
      - "mise run local             # one command through src/local.ts, no platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"

  - id: service-bun
    name: Service / dependency (TypeScript/Bun)
    description: An application dependency on defineService — the service and its connect link, create/update/delete as handlers typed from their schemas; tests are one run() call per action.
    path: bun/service
    type: service
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # every action in-process, no platform"
      - "mise run local             # one action through src/local.ts, no platform"
      - "np package dev             # browser dev UI against a mock platform"
      - "np package run             # a real agent on this machine spawns the worker"
      - "np package publish         # push the worker image + register the package"

  - id: collector-bun
    name: Catalog collector (TypeScript/Bun)
    description: Feed the catalog from a system of record on defineCollector — snapshots on a schedule, changes from a watch, mappings evaluated by catalog-ingest-api; tests are one run() call per snapshot, against an in-memory ingest.
    path: bun/collector
    type: collector
    sdk: bun
    post_init:
      - "mise trust mise.toml"
      - "mise install"
    next_steps:
      - "cd {{ .Slug }}"
      - "mise run test              # snapshots, the watch and the mapping, no network"
      - "mise run local             # one snapshot against an in-memory ingest (sends nothing)"
      - "mise run dev               # served against the in-memory ingest, with hot reload"
      - "mise run once              # one real snapshot (needs NP_API_KEY)"
      - "mise run publish:image     # build + push the collector image"
