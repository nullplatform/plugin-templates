[tools]
bun = "latest"

# Install is the root of the task graph: every task depends on it, so a fresh
# clone just works without remembering `bun install` first.
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]

[tasks.describe]
description = "Print the package manifest (what np package publish sends)"
depends = ["install"]
run = "bun src/index.ts --describe"

[tasks.test]
description = "Run the tests: every action in-process through run(), no platform"
depends = ["install"]
run = "bun test"

[tasks.typecheck]
description = "Type-check the package"
depends = ["install"]
run = "bunx tsc --noEmit -p ."

[tasks.build]
description = "Compile the worker to a single binary"
depends = ["install"]
run = "bun build --compile src/index.ts --outfile dist/{{ .Slug }}"
sources = ["src/**/*.ts", "package.json", "bun.lock"]
outputs = ["dist/{{ .Slug }}"]

[tasks."build:all"]
description = "Cross-compile the worker for every release target"
depends = ["install"]
run = """
bun build --compile --target=bun-linux-x64-musl   src/index.ts --outfile dist/{{ .Slug }}-linux-x64
bun build --compile --target=bun-linux-arm64-musl src/index.ts --outfile dist/{{ .Slug }}-linux-arm64
bun build --compile --target=bun-darwin-arm64     src/index.ts --outfile dist/{{ .Slug }}-darwin-arm64
"""

# One action answered locally, the way the agent execs the worker: the document
# (a fixture under test/fixtures, or your own) in NP_ACTION_CONTEXT, run through
# src/local.ts, whose in-memory ports reach no platform: each request the
# platform would get is told on stderr, the answer is stdout.
[tasks.local]
description = "Answer one document locally (default: test/fixtures/create-scope.json), no platform"
depends = ["install"]
usage = 'arg "[document]" help="The document the agent would deliver" default="test/fixtures/create-scope.json"'
run = 'NP_ACTION_CONTEXT="$(cat "$usage_document")" bun src/local.ts'

# `np package dev` → the browser dev UI: every run the manifest offers, the
# document the platform would send as the editor's starting point, live
# output. It starts src/local.ts, whose in-memory ports never call the real API.
[tasks.dev]
description = "Run the package with the dev UI"
depends = ["install"]
run = "bunx @nullplatform/plugin-dev-ui --plugin ."

# The worker image: the compiled package on a minimal base. The agent spawns
# it and dials it over gRPC/mTLS, injecting the port, the TLS material and the
# API key at runtime.
[tasks."build:image"]
description = "Build the worker image"
run = "docker build -t {{ .Slug }}-worker:dev ."

# `np package run` → run this package the way production does: a controlplane
# agent in Docker (worker backend) that spawns the worker image and streams
# actions to it over gRPC/mTLS. Needs NP_API_KEY. --network host so the agent
# reaches the worker it publishes on the host (Linux; on Docker Desktop enable
# host networking). The CLI hands over NP_PACKAGE_ENV_FLAGS / NP_PACKAGE_ENV_JSON
# so this shell's environment reaches the worker; both are empty under a plain
# `mise run run` and the task still works.
[tasks.run]
description = "Run locally: an agent (docker backend) that spawns this package's worker"
depends = ["build:image"]
run = """
set -eu
: "${NP_API_KEY:?set NP_API_KEY}"
slug="${NP_PACKAGE_SLUG:-{{ .Slug }}}"
env_json='{}'
[ -n "${NP_PACKAGE_ENV_JSON:-}" ] && env_json="$NP_PACKAGE_ENV_JSON"
worker_rules='[{"match":{"package":"'"$slug"'"},"env":'"$env_json"'}]'
docker rm -f np-{{ .Slug }}-agent >/dev/null 2>&1 || true
stale=$(docker ps -aq --filter "name=np-worker-.*-${slug}-")
[ -n "$stale" ] && docker rm -f $stale >/dev/null 2>&1
# shellcheck disable=SC2086
docker run --rm --name np-{{ .Slug }}-agent --network host \
  -v /var/run/docker.sock:/var/run/docker.sock \
  ${NP_PACKAGE_ENV_FLAGS:-} \
  -e NP_API_KEY -e NP_LOG_LEVEL="${NP_LOG_LEVEL:-INFO}" \
  -e NP_WORKER_BACKEND=docker \
  -e NP_WORKER_IMAGE={{ .Slug }}-worker:dev \
  -e NP_WORKER_RULES="$worker_rules" \
  "${NP_AGENT_IMAGE:-public.ecr.aws/nullplatform/controlplane-agent:latest}" \
  -runtime=host -tags=package:"$slug",local:"${NP_LOCAL_USER:-$USER}"
"""

# `np package publish` runs this when --image is omitted: build + push the
# worker image to $NP_PUSH_REGISTRY (any registry you are `docker login`ed to)
# and print registry/repo@sha256:<digest> on stdout for the CLI to register.
[tasks."publish:image"]
description = "Build + push the worker image; prints its digest ref"
run = "bash scripts/publish-image.sh"
