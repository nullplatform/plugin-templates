name: release

# Publish this UI plugin to nullplatform when you cut a GitHub Release.
# `np package publish` builds the bundle (the mise `build` task), uploads it and
# registers the package revision that pins it, versioned as the release tag.
# A UI plugin has no worker, so there is no image and no registry to log in to.
#
# Configure: secret NULLPLATFORM_API_KEY, variable NP_NRN. To install the new
# revision where the dashboard should mount it, set NP_INSTALL_NRN too.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NP_API_KEY: ${{ secrets.NULLPLATFORM_API_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mise provides bun and runs the package's own tasks.
      - uses: jdx/mise-action@v2
      - name: Install np CLI
        run: |
          curl https://cli.nullplatform.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run test
      # The release tag is the version the package revision is published as.
      - name: Publish package
        env:
          NP_VERSION: ${{ github.event.release.tag_name }}
        run: np package publish --nrn "${{ vars.NP_NRN }}" --version "${NP_VERSION#v}"
      - name: Install the published revision
        if: ${{ vars.NP_INSTALL_NRN != '' }}
        env:
          NP_VERSION: ${{ github.event.release.tag_name }}
        run: np package install --nrn "${{ vars.NP_INSTALL_NRN }}" --version "${NP_VERSION#v}"
