name: release

# Build + push the collector image when you cut a GitHub Release. The image is
# tagged with the release version; deploy it as a long-lived container (served:
# its schedule and its watch) or as a cron job (NP_ACTION_CONTEXT='{}': one
# snapshot).
#
# Works out of the box: the image goes to this repo's GitHub Container Registry
# (ghcr.io/<owner>/<repo>) using the built-in GITHUB_TOKEN. To push elsewhere,
# set the NP_PUSH_REGISTRY variable and REGISTRY_USERNAME / REGISTRY_PASSWORD
# secrets.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  NP_PUSH_REGISTRY: ${{ vars.NP_PUSH_REGISTRY || format('ghcr.io/{0}', github.repository) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # buildx + QEMU so publish:image can build the multi-arch (amd64+arm64) image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          user="${REGISTRY_USERNAME:-$GHCR_USER}"
          pass="${REGISTRY_PASSWORD:-$GHCR_TOKEN}"
          echo "$pass" | docker login "${NP_PUSH_REGISTRY%%/*}" -u "$user" --password-stdin
      - name: Publish image
        env:
          NP_VERSION: ${{ github.event.release.tag_name }}
        run: mise run publish:image
