# The {{ .Slug }} collector as a cron job, in place of deploy/collector.yaml:
# each run takes one snapshot (NP_ACTION_CONTEXT='{}'), prints its result and
# exits; nothing watches between runs. Apply it the same way, after the same
# namespace and secret:
#
#   sed "s|COLLECTOR_IMAGE|$IMAGE|" deploy/cronjob.yaml | kubectl apply -f -
#
# The schedule is the cron job's: every six hours here, the definition's
# schedule a served collector keeps. A run never overlaps the one before it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Slug }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Slug }}
  namespace: {{ .Slug }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Slug }}
  namespace: {{ .Slug }}
  labels:
    app.kubernetes.io/name: {{ .Slug }}
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Slug }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Slug }}
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: COLLECTOR_IMAGE
              env:
                # One snapshot, then exit.
                - name: NP_ACTION_CONTEXT
                  value: "{}"
              envFrom:
                - secretRef:
                    name: {{ .Slug }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
