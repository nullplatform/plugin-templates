[tools]
bun = "latest"

[env]
SUPPRESS_NO_CONFIG_WARNING = "1"

[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]

[tasks.describe]
description = "Print the package manifest (what np package publish sends)"
depends = ["install"]
run = "bun src/main.ts --describe"

[tasks.test]
description = "Run the tests: every action in-process through pkg.run(), no platform"
depends = ["install"]
run = "bun test"

[tasks.typecheck]
description = "Type-check the package"
depends = ["install"]
run = "bunx tsc --noEmit -p ."

[tasks.build]
description = "Compile the worker to a single binary"
depends = ["install"]
run = "bun build --compile src/main.ts --outfile dist/{{ .Slug }}"
sources = ["src/**/*.ts", "package.json", "bun.lock"]
outputs = ["dist/{{ .Slug }}"]

[tasks."build:all"]
description = "Cross-compile the worker for every release target"
depends = ["install"]
run = """
bun build --compile --target=bun-linux-x64-musl   src/main.ts --outfile dist/{{ .Slug }}-linux-x64
bun build --compile --target=bun-linux-arm64-musl src/main.ts --outfile dist/{{ .Slug }}-linux-arm64
bun build --compile --target=bun-darwin-arm64     src/main.ts --outfile dist/{{ .Slug }}-darwin-arm64
"""

[tasks.dev]
description = "Run the package with the dev UI"
depends = ["install"]
run = "bunx @nullplatform/plugin-dev-ui --plugin ."

[tasks."build:image"]
description = "Build the worker image"
run = "docker build -t {{ .Slug }}-worker:dev ."

[tasks.run]
description = "Run locally: an agent (docker backend) that spawns this package's worker"
depends = ["build:image"]
run = """
set -eu
: "${NP_API_KEY:?set NP_API_KEY}"
slug="${NP_PACKAGE_SLUG:-{{ .Slug }}}"
env_json='{}'
[ -n "${NP_PACKAGE_ENV_JSON:-}" ] && env_json="$NP_PACKAGE_ENV_JSON"
worker_rules='[{"match":{"package":"'"$slug"'"},"env":'"$env_json"'}]'
docker rm -f np-{{ .Slug }}-agent >/dev/null 2>&1 || true
stale=$(docker ps -aq --filter "name=np-worker-.*-${slug}-")
[ -n "$stale" ] && docker rm -f $stale >/dev/null 2>&1
docker run --rm --name np-{{ .Slug }}-agent --network host \
  -v /var/run/docker.sock:/var/run/docker.sock \
  ${NP_PACKAGE_ENV_FLAGS:-} \
  -e NP_API_KEY -e NP_LOG_LEVEL="${NP_LOG_LEVEL:-INFO}" \
  -e NP_WORKER_BACKEND=docker \
  -e NP_WORKER_IMAGE={{ .Slug }}-worker:dev \
  -e NP_WORKER_RULES="$worker_rules" \
  "${NP_AGENT_IMAGE:-public.ecr.aws/nullplatform/controlplane-agent:latest}" \
  -runtime=host -tags=package:"$slug",local:"${NP_LOCAL_USER:-$USER}"
"""

[tasks."publish:image"]
description = "Build + push the worker image; prints its digest ref"
run = "bash scripts/publish-image.sh"
